packages:
  # Top-level command / API packages
  - 'api/*'
  - 'api/*/*'
  - 'api/*/*/*'
  - 'bin/*'
  - 'cmd/*'
  - 'cmd/*/*'
  - 'cmd/*/*/*'

  # Domain packages (connectors, kernels, agents are nested)
  - 'domains/*'
  - 'domains/*/*'
  - 'domains/*/*/*'
  - 'domains/*/*/*/*'

  # MCP packages
  - 'mcp/*'
  - 'mcp/*/*'

  # Infrastructure packages
  - 'infrastructure/*'
  - 'infrastructure/*/*'
  - 'infrastructure/*/*/*'

  # Internal SDK packages (being consolidated to platform/)
  - 'packages/*'
  - 'packages/@allternit/*'
  - 'packages/@allternit/*/*'
  - 'packages/@allternit/*/*/*'
  - 'packages/@allternit/*/*/*/*'

  # Platform packages
  - 'platform/*'
  - 'platform/*/*'
  - 'platform/*/*/*'

  # Plugins
  - 'plugins/*'

  # Public SDK packages
  - 'sdk/*'

  # Services (heavily nested)
  - 'services/*'
  - 'services/*/*'
  - 'services/*/*/*'
  - 'services/*/*/*/*'

  # Web / desktop surfaces
  - 'surfaces/*'
  - 'surfaces/*/*'
  - 'surfaces/*/*/*'
  - 'surfaces/*/*/*/*'
  - 'surfaces/allternit-extensions/allternit-extension/packages/*'

  # Exclusions
  - '!cmd/*/sdks'
  - '!packages/@allternit/adapters/src/**'
  - '!surfaces/ai.allternit.com/adapters-ts/**'

onlyBuiltDependencies:
  - '@whiskeysockets/baileys'
  - better-sqlite3
  - canvas
  - electron
  - protobufjs
  - sharp
  - sqlite3
