packages:
  # Top-level command / API packages
  - 'api/*'
  - 'api/*/*'
  - 'api/*/*/*'
  - 'bin/*'
  - 'cmd/*'
  - 'cmd/*/*'
  - 'cmd/*/*/*'

  # Domain packages (connectors, kernels, agents are nested)
  - 'domains/*'
  - 'domains/*/*'
  - 'domains/*/*/*'
  - 'domains/*/*/*/*'

  # MCP packages
  - 'mcp/*'
  - 'mcp/*/*'

  # Infrastructure packages
  - 'infrastructure/*'
  - 'infrastructure/*/*'
  - 'infrastructure/*/*/*'

  # Internal SDK packages (being consolidated to platform/)
  - 'packages/*'
  - 'packages/@allternit/*'
  - 'packages/@allternit/*/*'
  - 'packages/@allternit/*/*/*'
  - 'packages/@allternit/*/*/*/*'

  # Platform packages
  - 'platform/*'
  - 'platform/*/*'
  - 'platform/*/*/*'

  # Public SDK packages
  - 'sdk/*'

  # Services (heavily nested)
  - 'services/*'
  - 'services/*/*'
  - 'services/*/*/*'
  - 'services/*/*/*/*'

  # Web / desktop surfaces
  - 'surfaces/*'
  - 'surfaces/*/*'
  - 'surfaces/*/*/*'
  - 'surfaces/*/*/*/*'
  - 'surfaces/allternit-extensions/allternit-extension/packages/*'

  # Exclusions
  - '!cmd/*/sdks'
  # Vendored third-party project with its own npm lockfile/scripts — see
  # services/open-connector/PROVENANCE.md. Managed via plain npm, not pnpm.
  - '!services/open-connector'
  - '!services/open-connector/**'
  # Vendored Docmost wiki — fully gitignored local checkout, managed via its
  # own pnpm-lock. Excluded so root pnpm does not ingest it as a package.
  - '!services/docmost'
  - '!services/docmost/**'

# pnpm 10 reads overrides from this file, not from package.json.
overrides:
  '@types/react': ^18.3.28
  '@types/react-dom': ^18.3.1
  '@types/express-serve-static-core': ^4.19.8
  '@reduxjs/toolkit': ^2.2.7
  react-redux: ^9.1.2
  redux: ^5.0.1
  # wxt 0.20 uses Rollup hook filters, which require Vite >= 6.3. Vite 5
  # silently ignores them, so wxt's download plugin then runs on every module
  # and `wxt prepare` fails with "Failed to parse URL from <entrypoint>".
  'wxt>vite': ^8.0.0

onlyBuiltDependencies:
  - '@whiskeysockets/baileys'
  - better-sqlite3
  - canvas
  - electron
  - protobufjs
  - sharp
  - sqlite3

patchedDependencies:
  follow-redirects@1.15.11: patches/follow-redirects@1.15.11.patch

# Release builds cross-compile (bun --compile) for every target on every
# runner, so platform-conditional optional deps (e.g. @opentui/core-*) must
# be installed for ALL OS/arch combos, not just the host's.
supportedArchitectures:
  os: [darwin, linux, win32]
  cpu: [arm64, x64]
