<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{product_name}} Dashboard</title>
  <style>
    :root { --bg: #f6f6f6; --surface: #fff; --fg: #111; --muted: #666; --border: #e5e5e5; --accent: #111; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); display: flex; height: 100vh; }
    aside { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; }
    main { flex: 1; overflow: auto; padding: 32px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .kpi .value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .kpi .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <aside>Nav</aside>
  <main>
    <h1>{{product_name}}</h1>
    <div class="kpi-grid">
      <div class="kpi"><div class="value">0</div><div class="label">Metric</div></div>
      <div class="kpi"><div class="value">0</div><div class="label">Metric</div></div>
      <div class="kpi"><div class="value">0</div><div class="label">Metric</div></div>
    </div>
  </main>
</body>
</html>
