<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allternit Desktop Cloud Admin</title>
  <style>
    :root {
      --bg: #0f0c0a;
      --bg-elevated: #181512;
      --bg-card: #211c18;
      --border: #2e2822;
      --text: #faf9f7;
      --text-secondary: #a8a19a;
      --accent: #d97757;
      --success: #4ade80;
      --warning: #facc15;
      --error: #f87171;
      --radius: 12px;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      background: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .muted {
      color: var(--text-secondary);
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--text-secondary);
      font-weight: 500;
    }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(217, 119, 87, 0.15);
      color: var(--accent);
    }
    .badge.linux { background: rgba(74, 222, 128, 0.12); color: var(--success); }
    .badge.windows { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge.macos { background: rgba(250, 204, 21, 0.12); color: var(--warning); }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    button {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
    .status.error { border-color: var(--error); color: var(--error); }
    .status.success { border-color: var(--success); color: var(--success); }
    .empty { padding: 24px 0; text-align: center; }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .metric:last-child { border-bottom: none; }
    .metric strong { font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">A</div>
      <div>
        <h1>Desktop Cloud Admin</h1>
        <p>Provision and manage heterogeneous desktops from one place.</p>
      </div>
    </header>

    <div class="grid">
      <section class="card" style="grid-column: 1 / -1;">
        <h2>Provision Desktop</h2>
        <label for="bot-select">Bot</label>
        <select id="bot-select"><option value="">Loading bots…</option></select>

        <label for="template-select">Template</label>
        <select id="template-select"><option value="">Loading templates…</option></select>

        <button id="provision-btn" disabled>Provision desktop</button>
        <div id="provision-status" class="status" style="display:none"></div>
      </section>

      <section class="card">
        <h2>Templates</h2>
        <div id="templates-table"><p class="muted">Loading…</p></div>
      </section>

      <section class="card">
        <h2>Capacity</h2>
        <div id="capacity-content"><p class="muted">Loading…</p></div>
      </section>

      <section class="card">
        <h2>Usage Summary</h2>
        <div id="usage-content"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </div>

  <script type="module">
    import {
      listAgents,
      listTemplates,
      getCapacity,
      getUsageSummary,
      provisionDesktop,
    } from './desktop-cloud-admin.js';

    const botSelect = document.getElementById('bot-select');
    const templateSelect = document.getElementById('template-select');
    const provisionBtn = document.getElementById('provision-btn');
    const provisionStatus = document.getElementById('provision-status');

    function setStatus(el, text, type = '') {
      el.style.display = 'block';
      el.textContent = text;
      el.className = `status ${type}`;
    }

    function fmtMiB(mib) {
      return mib >= 1024 ? `${(mib / 1024).toFixed(1)} GiB` : `${mib} MiB`;
    }

    async function loadTemplates() {
      try {
        const templates = await listTemplates();
        templateSelect.innerHTML = templates
          .map((t) => `<option value="${t.id}">${t.name} (${t.os})</option>`)
          .join('');
        document.getElementById('templates-table').innerHTML = `
          <table>
            <thead><tr><th>Name</th><th>OS</th><th>CPU</th><th>RAM</th><th>Disk</th></tr></thead>
            <tbody>
              ${templates.map((t) => `
                <tr>
                  <td>${t.name}</td>
                  <td><span class="badge ${t.os}">${t.os}</span></td>
                  <td>${t.cpu_millis / 1000}</td>
                  <td>${fmtMiB(t.memory_mib)}</td>
                  <td>${fmtMiB(t.disk_mib)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
        updateProvisionReady();
      } catch (err) {
        document.getElementById('templates-table').innerHTML = `<p class="muted">Error: ${err.message}</p>`;
      }
    }

    async function loadAgents() {
      try {
        const agents = await listAgents();
        if (agents.length === 0) {
          botSelect.innerHTML = '<option value="">No bots found</option>';
        } else {
          botSelect.innerHTML = agents
            .map((a) => `<option value="${a.id}">${a.name || a.id}</option>`)
            .join('');
        }
        updateProvisionReady();
      } catch (err) {
        botSelect.innerHTML = `<option value="">Error: ${err.message}</option>`;
      }
    }

    async function loadCapacity() {
      try {
        const data = await getCapacity();
        const snapshots = data.snapshots || [];
        document.getElementById('capacity-content').innerHTML = `
          <div class="metric"><span>Scale-up recommended</span><strong style="color:${data.scale_up_recommended ? 'var(--warning)' : 'var(--success)'}">${data.scale_up_recommended ? 'Yes' : 'No'}</strong></div>
          ${snapshots.map((s) => `
            <div class="metric">
              <span>${s.provider} — ${s.host}</span>
              <strong>${s.healthy ? 'Healthy' : 'Unhealthy'}</strong>
            </div>
            <div class="muted" style="margin-bottom:10px">
              Used ${s.total_cpu_millis - s.available_cpu_millis} / ${s.total_cpu_millis} CPU ·
              ${s.total_memory_mib - s.available_memory_mib} / ${s.total_memory_mib} MiB RAM ·
              ${s.active_executions} active
            </div>
          `).join('')}`;
      } catch (err) {
        document.getElementById('capacity-content').innerHTML = `<p class="muted">Error: ${err.message}</p>`;
      }
    }

    async function loadUsage() {
      try {
        const data = await getUsageSummary();
        document.getElementById('usage-content').innerHTML = `
          <div class="metric"><span>Total minutes</span><strong>${data.total_minutes}</strong></div>
          <div class="metric"><span>Total cost</span><strong>${data.total_cost.toFixed(4)} ${data.currency}</strong></div>
          <div class="metric"><span>Billed rows</span><strong>${data.rows}</strong></div>`;
      } catch (err) {
        document.getElementById('usage-content').innerHTML = `<p class="muted">Error: ${err.message}</p>`;
      }
    }

    function updateProvisionReady() {
      provisionBtn.disabled = !(botSelect.value && templateSelect.value);
    }

    botSelect.addEventListener('change', updateProvisionReady);
    templateSelect.addEventListener('change', updateProvisionReady);

    provisionBtn.addEventListener('click', async () => {
      const botId = botSelect.value;
      const templateId = templateSelect.value;
      if (!botId || !templateId) return;
      provisionBtn.disabled = true;
      setStatus(provisionStatus, 'Provisioning…');
      try {
        const result = await provisionDesktop(botId, templateId);
        setStatus(
          provisionStatus,
          `Provisioned ${result.provider} desktop for bot ${botId}.\nSandbox: ${result.sandbox_id}\nStatus: ${result.status}`,
          'success'
        );
        setTimeout(loadCapacity, 2000);
      } catch (err) {
        setStatus(provisionStatus, `Provisioning failed: ${err.message}`, 'error');
      } finally {
        provisionBtn.disabled = false;
      }
    });

    loadAgents();
    loadTemplates();
    loadCapacity();
    loadUsage();
  </script>
</body>
</html>
