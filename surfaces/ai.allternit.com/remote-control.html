<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Allternit Remote Control</title>
    <meta name="description" content="Carry your Allternit agents with you across machines." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/remote-control.webmanifest" />
    <meta name="theme-color" content="#0F0C0A" />
    <script>
      (function () {
        try {
          var key = 'allternit-remote-control-theme-storage';
          var s = localStorage.getItem(key);
          var parsed = s ? JSON.parse(s) : null;
          var t = parsed && parsed.state && parsed.state.theme;
          var r;
          if (t === 'dark' || t === 'light') {
            r = t;
          } else {
            // Default to the platform/system color mode, not an arbitrary brand preset.
            r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            localStorage.setItem(key, JSON.stringify({ state: { theme: 'system' }, version: 0 }));
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/remote-control/main.tsx"></script>
  </body>
</html>
