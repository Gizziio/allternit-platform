appId: com.allternit.mobile
---
# Verifies Platform settings opens from the Settings root.
- launchApp:
    appId: com.allternit.mobile
    clearState: true
    arguments:
      skip-auth: true
      -open-settings: true
      -open-settings-platform: true
- tapOn:
    text: "Dismiss notifications prompt"
    optional: true
- assertVisible: "Platform"
- assertVisible: "Language"
- assertVisible: "Timezone"
- takeScreenshot: settings_platform
- stopApp
