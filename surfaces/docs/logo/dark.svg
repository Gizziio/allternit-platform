  <rect x="60" y="46" width="10" height="10" fill="#E8C39E"/>
  <rect x="52" y="36" width="10" height="10" fill="#E8C39E"/>

  <rect x="38" y="46" width="10" height="10" fill="#E8C39E" opacity="0.75"/>
  <rect x="52" y="46" width="10" height="10" fill="#E8C39E" opacity="0.75"/>

