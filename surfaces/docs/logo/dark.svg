    <line x1="50" y1="50" x2="70" y2="30" opacity="0.12"/>
    <line x1="50" y1="50" x2="30" y2="70" opacity="0.12"/>
    <line x1="50" y1="50" x2="70" y2="70" opacity="0.12"/>
  </g>

  <g fill="#E8C39E" opacity="0.5">
    <rect x="49" y="19" width="2" height="2"/>
    <rect x="49" y="79" width="2" height="2"/>
    <rect x="24" y="49" width="2" height="2"/>
