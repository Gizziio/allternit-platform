[package]
name = "allternit-mux"
version = "0.1.0"
edition = "2021"
authors = ["Allternit Team <team@allternit.io>"]
license = "MIT OR Apache-2.0"
description = "Allternit Mux - unified agent terminal multiplexer daemon and CLI"

[[bin]]
name = "allternit-mux"
path = "src/main.rs"

[lib]
name = "allternit_mux"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
vt100 = "0.15"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
