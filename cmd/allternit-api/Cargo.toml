[package]
name = "allternit-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "allternit-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true, features = ['json', 'stream'] }
async-stream = { workspace = true }
axum-extra = { version = "0.9", features = ["typed-header"] }
urlencoding = { workspace = true }
tokio-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }

# Internal crates - Rails & Cowork
allternit-agent-system-rails = { path = "../../rails" }
allternit-cowork-runtime = { path = "../../infrastructure/executor/cowork/cowork/allternit-cowork-runtime" }
allternit-cowork-scheduler = { path = "../../infrastructure/executor/cowork/cowork/allternit-cowork-scheduler" }
allternit-gc-agents = { workspace = true }

# Internal crates - Execution
allternit-driver-interface = { path = "../../platform/contracts/driver-interface" }
allternit-firecracker-driver = { path = "../../drivers/firecracker" }
allternit-session-manager = { path = "../../services/session-manager" }

# WebSocket
tokio-tungstenite = { workspace = true }
futures = "0.3"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rand = "0.8"
anyhow = "1"
dirs = "5"
jsonwebtoken = "10"
aws-lc-rs = "1"
async-trait = "0.1"
hostname = "0.4"
hex = "0.4"
once_cell = { workspace = true }
rustls-pemfile = "2"

# HTTP middleware
tower-http = { workspace = true, features = ["fs", "cors"] }

# Metrics
prometheus = { workspace = true }

# Crypto
hmac = "0.12"
sha2 = "0.10"
md5 = "0.7"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# SSH client
russh = "0.60"

# PNG Rendering dependencies
resvg = "0.41"
usvg = "0.41"
tiny-skia = "0.11"
image = "0.24"
base64 = "0.22"

# PDF Rendering dependencies
printpdf = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
allternit-apple-vf-driver = { path = "../../drivers/apple-vf" }

# Token counting
tiktoken-rs = "0.12.0"

# Testing
[dev-dependencies]
axum-test = "14"
tempfile = "3"
# `ServiceExt::oneshot` for in-process route tests (workspace tower is 0.5;
# the util feature is additive and matches axum 0.7's service traits).
tower = { workspace = true, features = ["util"] }

[features]
default = ["vm-driver"]
vm-driver = []

# Make this package independent from the root workspace so it can build
# even when other workspace members have broken manifests.
# [workspace]
