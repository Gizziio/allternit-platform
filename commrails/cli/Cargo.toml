[package]
name = "commrails"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "commrails"
path = "src/main.rs"

[[bin]]
name = "rails"
path = "src/main.rs"

[features]
default = ["dolt"]
dolt = ["allternit-commrails/dolt"]

[dependencies]
allternit-commrails = { path = ".." }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
