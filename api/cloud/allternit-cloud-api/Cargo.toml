[package]
name = "allternit-cloud-api"
version = "0.1.0"
edition = "2021"
description = "Allternit Cloud API - Backend API for cloud deployment"

[[bin]]
name = "allternit-cloud-api"
path = "src/main.rs"

[dependencies]
# Allternit internal
allternit-cloud-core = { path = ".." }
allternit-cloud-ssh = { path = "../allternit-cloud-ssh" }
allternit-cloud-hetzner = { path = "../../allternit-cloud-providers/hetzner" }

# Web framework
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

# Time
chrono = { workspace = true }
chrono-tz = "0.9"

# UUID
uuid = { workspace = true }

# Database (SQLite for now)
sqlx = { workspace = true, features = ['chrono', 'uuid'] }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }
rand = { workspace = true }
md5 = "0.7"
cron = "0.12"
tempfile = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
reqwest = { workspace = true, features = ['json'] }
assert_matches = "1.5"
serial_test = "3.2"
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
