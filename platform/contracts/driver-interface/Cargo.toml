[package]
name = "allternit-driver-interface"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Execution driver interface - core abstraction for execution substrates (process, micro-VM, container, WASM)"
authors = ["Allternit Team"]
repository = "https://github.com/Gizziio/allternit-driver-interface"
homepage = "https://github.com/Gizziio/allternit-driver-interface"
keywords = ["execution", "driver", "vm", "container", "sandbox"]
categories = ["os", "virtualization"]
rust-version = "1.80"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
