[package]
name = "allternitos-cloud-contracts"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
description = "Canonical AllternitOS Layer 1 contracts exposed to the Cloud commercial layer."

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = "1.0"

[dev-dependencies]
serde_json = { version = "1" }
