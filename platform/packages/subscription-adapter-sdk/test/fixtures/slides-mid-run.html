<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>fixture-web — slides mid-run</title></head>
  <body data-state="slides-mid-run">
    <header>
      <div data-testid="fw-user-menu" class="fw-user-menu">fixture-user</div>
    </header>
    <main>
      <section data-testid="fw-deck-panel" data-total-slides="5">
        <div data-testid="fw-counter" class="fw-counter">2/5 slides</div>
        <div class="fw-deck-thumbs">
          <img
            class="fw-slide-thumb"
            data-artifact-id="fw-deck-1-slide-1"
            src="https://cdn.fixture-web.test/decks/fw-deck-1/slide-1.png"
            alt="Slide 1 thumbnail"
          >
          <img
            class="fw-slide-thumb"
            data-artifact-id="fw-deck-1-slide-2"
            src="https://cdn.fixture-web.test/decks/fw-deck-1/slide-2.png"
            alt="Slide 2 thumbnail"
          >
        </div>
      </section>
      <div data-testid="fw-response" class="fw-response">
        <p>Building your deck…</p>
      </div>
    </main>
  </body>
</html>
