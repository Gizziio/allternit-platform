<title>Agent Activity Center — Design Mockup</title>
<style>
  :root {
    --surface-canvas: #fafafa; --surface-panel: #ffffff; --surface-active: #f3f4f6; --surface-hover: #e5e7eb;
    --text-primary: #111111; --text-secondary: #4b5563; --text-muted: #9ca3af;
    --border-muted: #e5e7eb; --border-default: #d1d5db;
    --accent-primary: #7c3aed; --accent-primary-rgb: 124, 58, 237;
    --status-success: #22c55e; --status-success-rgb: 34, 197, 94;
    --status-warning: #f59e0b; --status-warning-rgb: 245, 158, 11;
    --status-error: #ef4444; --status-error-rgb: 239, 68, 68;
    --status-info: #3b82f6; --status-info-rgb: 59, 130, 246;
    --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-canvas: #0a0a0b; --surface-panel: #141416; --surface-active: #202024; --surface-hover: #2a2a2e;
      --text-primary: #f0f0f0; --text-secondary: #a1a1aa; --text-muted: #6b6b70;
      --border-muted: #27272a; --border-default: #3a3a3e;
      --accent-primary: #a78bfa; --accent-primary-rgb: 167, 139, 250;
    }
  }
  :root[data-theme="dark"] {
    --surface-canvas: #0a0a0b; --surface-panel: #141416; --surface-active: #202024; --surface-hover: #2a2a2e;
    --text-primary: #f0f0f0; --text-secondary: #a1a1aa; --text-muted: #6b6b70;
    --border-muted: #27272a; --border-default: #3a3a3e;
    --accent-primary: #a78bfa; --accent-primary-rgb: 167, 139, 250;
  }
  :root[data-theme="light"] {
    --surface-canvas: #fafafa; --surface-panel: #ffffff; --surface-active: #f3f4f6; --surface-hover: #e5e7eb;
    --text-primary: #111111; --text-secondary: #4b5563; --text-muted: #9ca3af;
    --border-muted: #e5e7eb; --border-default: #d1d5db;
    --accent-primary: #7c3aed; --accent-primary-rgb: 124, 58, 237;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--surface-canvas); color: var(--text-primary); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }

  .note-banner { background: rgba(var(--accent-primary-rgb), .08); border-bottom: 1px solid var(--border-muted); padding: 10px 20px;
    font-size: .82em; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
  .note-banner b { color: var(--text-primary); }

  .demo-shell { height: calc(100vh - 41px); display: flex; flex-direction: column; }

  /* Top bar with nav-rail entry point context */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 52px; border-bottom: 1px solid var(--border-muted); background: var(--surface-panel); flex-shrink: 0; }
  .topbar .rail-icons { display: flex; gap: 4px; align-items: center; color: var(--text-muted); }
  .rail-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .bell-wrap { position: relative; }
  .bell-wrap .rail-icon { background: rgba(var(--accent-primary-rgb), .12); color: var(--accent-primary); cursor: pointer; }
  .badge-count { position: absolute; top: -3px; right: -3px; background: var(--status-error); color: white; font: 700 10px/1 var(--font-mono);
    min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .topbar .divider { width: 1px; height: 22px; background: var(--border-muted); }
  .topbar h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .topbar .sub { color: var(--text-muted); font-size: .82em; }
  .topbar .entry-label { margin-left: auto; font-size: .78em; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .entry-label .arrow { color: var(--accent-primary); font-size: 1.1em; }

  /* Tabs */
  .tabbar { display: flex; gap: 4px; padding: 0 20px; height: 40px; align-items: center; border-bottom: 1px solid var(--border-muted); background: var(--surface-panel); flex-shrink: 0; }
  .tab { font: inherit; font-weight: 600; font-size: .87em; color: var(--text-secondary); background: none; border: none; cursor: pointer;
    padding: 8px 2px; margin-right: 22px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-primary); }
  .tab .n { font-family: var(--font-mono); color: var(--text-muted); margin-left: 5px; }
  .tab.active .n { color: var(--accent-primary); }

  /* Main two-pane */
  .main { flex: 1; display: flex; min-height: 0; }
  .thread-list { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border-muted); overflow-y: auto; background: var(--surface-panel); }
  .thread-row { padding: 12px 16px; border-bottom: 1px solid var(--border-muted); cursor: pointer; display: flex; gap: 10px; }
  .thread-row:hover { background: var(--surface-hover); }
  .thread-row.selected { background: rgba(var(--accent-primary-rgb), .08); border-left: 2px solid var(--accent-primary); padding-left: 14px; }
  .thread-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-primary); margin-top: 6px; flex-shrink: 0; }
  .thread-row.read .dot { visibility: hidden; }
  .thread-row-body { min-width: 0; flex: 1; }
  .thread-topic { font-weight: 650; font-size: .89em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-preview { color: var(--text-secondary); font-size: .82em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .thread-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .thread-time { color: var(--text-muted); font-size: .74em; font-family: var(--font-mono); }
  .pill { font-size: .68em; font-weight: 700; padding: 2px 7px; border-radius: 999px; letter-spacing: .02em; }
  .pill-review { background: rgba(var(--status-warning-rgb), .12); border: 1px solid rgba(var(--status-warning-rgb), .3); color: var(--status-warning); }
  .pill-done { background: rgba(var(--status-success-rgb), .12); border: 1px solid rgba(var(--status-success-rgb), .3); color: var(--status-success); }

  /* Detail pane */
  .detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .detail-header { padding: 16px 24px; border-bottom: 1px solid var(--border-muted); background: var(--surface-panel); }
  .detail-header .topic { font-size: 1.05em; font-weight: 700; }
  .detail-header .thread-id { font-family: var(--font-mono); font-size: .78em; color: var(--text-muted); margin-top: 3px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn { font: inherit; font-weight: 600; font-size: .82em; border-radius: 7px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--border-default); background: var(--surface-panel); color: var(--text-secondary); }
  .btn:hover { background: var(--surface-hover); }

  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 640px; }
  .msg-avatar { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; }
  .msg-avatar.agent { background: var(--accent-primary); }
  .msg-avatar.system { background: var(--text-muted); }
  .msg-avatar.human { background: var(--status-info); }
  .msg-body { min-width: 0; }
  .msg-sender { font-weight: 650; font-size: .82em; }
  .msg-sender .role { color: var(--text-muted); font-weight: 500; margin-left: 6px; }
  .msg-text { font-size: .89em; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }
  .msg-text code { font-family: var(--font-mono); background: var(--surface-active); padding: .1em .35em; border-radius: 4px; font-size: .92em; }
  .msg-time { font-size: .72em; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px; }

  .review-card { background: rgba(var(--status-warning-rgb), .06); border: 1px solid rgba(var(--status-warning-rgb), .3); border-radius: 10px; padding: 14px 16px; max-width: 640px; }
  .review-card .rc-title { font-weight: 700; font-size: .87em; display: flex; align-items: center; gap: 7px; color: var(--text-primary); }
  .review-card .rc-title .ico { color: var(--status-warning); }
  .review-card .rc-diff { font-family: var(--font-mono); font-size: .78em; color: var(--text-secondary); margin-top: 6px; background: var(--surface-panel); border: 1px solid var(--border-muted); border-radius: 6px; padding: 6px 10px; }
  .review-card .rc-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-approve { background: var(--status-success); border-color: var(--status-success); color: white; }
  .btn-approve:hover { opacity: .9; background: var(--status-success); }
  .btn-deny { background: transparent; border-color: rgba(var(--status-error-rgb), .4); color: var(--status-error); }
  .btn-deny:hover { background: rgba(var(--status-error-rgb), .08); }
  .review-card.resolved { opacity: .6; }
  .review-card .resolved-tag { font-size: .78em; font-weight: 700; color: var(--status-success); margin-top: 10px; display: none; }
  .review-card.resolved .rc-actions { display: none; }
  .review-card.resolved .resolved-tag { display: block; }

  .composer { border-top: 1px solid var(--border-muted); padding: 12px 24px 16px; background: var(--surface-panel); flex-shrink: 0; }
  .composer-box { display: flex; gap: 8px; align-items: center; background: var(--surface-active); border: 1px solid var(--border-default); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .composer-box input { flex: 1; border: none; background: none; outline: none; font: inherit; color: var(--text-primary); }
  .composer-box input::placeholder { color: var(--text-muted); }
  .send-btn { background: var(--accent-primary); color: white; border: none; border-radius: 7px; padding: 7px 14px; font: inherit; font-weight: 650; font-size: .85em; cursor: pointer; }

  ::selection { background: rgba(var(--accent-primary-rgb), .25); }
</style>

<div class="note-banner">
  <span>🎨</span> <b>Design mockup, not live data.</b> Clicking threads switches the detail pane; Approve/Deny is a visual demo only.
</div>

<div class="demo-shell">
  <div class="topbar">
    <div class="rail-icons">
      <div class="rail-icon">💬</div>
      <div class="rail-icon">📁</div>
      <div class="bell-wrap">
        <div class="rail-icon">🔔<span class="badge-count">3</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <h1>Agent Activity</h1>
    </div>
    <div class="entry-label"><span class="arrow">←</span> promoted from the hidden ⌘⇧M overlay into real nav</div>
  </div>

  <div class="tabbar">
    <button class="tab active">All <span class="n">6</span></button>
    <button class="tab">Needs Review <span class="n">2</span></button>
    <button class="tab">Archived <span class="n">1</span></button>
  </div>

  <div class="main">
    <div class="thread-list" id="threadList"></div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
const THREADS = [
  {
    id: "wih:executor-changeset-review",
    topic: "Changeset Review — iOS Code tab",
    read: false,
    needsReview: true,
    time: "2m ago",
    messages: [
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "14:02", text: "Started phase 1: PermissionClient.swift + ChangesetReviewSheet.swift" },
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "14:31", text: "Wired banner into CodeThreadChatView. Wrote docs/CHANGESET_REVIEW_PHASE_1_NOTES.md." },
    ],
    review: { diff: "surfaces/allternit-mobile/ios/Features/Code/ChangesetReviewSheet.swift (+216)", resolved: false },
  },
  {
    id: "wih:executor-automation-cron",
    topic: "Automation Tasks — cron jobs (phase 1)",
    read: false,
    needsReview: true,
    time: "41m ago",
    messages: [
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "13:10", text: "Built CronClient, CronJobStore, AutomationTasksListView." },
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "13:44", text: "Wired into ModeBarItem + MainWorkspaceView. Ready for review." },
    ],
    review: { diff: "surfaces/allternit-mobile/ios/Features/Automation/ (6 files, +1411)", resolved: false },
  },
  {
    id: "wih:executor-cowork-tasks",
    topic: "Cowork Tasks — flat task list",
    read: true,
    needsReview: false,
    time: "1h ago",
    messages: [
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "09:45", text: "Task list + detail + create sheet done, wired into ComposerPlusSheet." },
      { sender: "Eoj", role: "you", kind: "human", time: "09:52", text: "Approved and merged as PR #13." },
    ],
    review: { diff: "surfaces/allternit-mobile/ios/Features/Cowork/ (3 files, +981)", resolved: true },
  },
  {
    id: "wih:executor-ci-issue-6",
    topic: "CI fix — typography validator + Vercel",
    read: true,
    needsReview: false,
    time: "3h ago",
    messages: [
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "07:12", text: "Found 766 violations, mostly validator bugs. Root-caused Vercel as vestigial." },
      { sender: "system", role: "ci", kind: "system", time: "07:58", text: "validate-typography: PASS (19s)" },
    ],
    review: null,
  },
  {
    id: "wih:executor-pr1-finalize",
    topic: "PR #1 — resolve merge conflict",
    read: true,
    needsReview: false,
    time: "3h ago",
    messages: [
      { sender: "gizzi-code", role: "agent", kind: "agent", time: "07:40", text: "Resolved .steering/checkpoint.md + spec.md conflicts. mergeStateStatus: CLEAN." },
    ],
    review: null,
  },
  {
    id: "wih:executor-device-pairing",
    topic: "Device Pairing — add Deny",
    read: true,
    needsReview: false,
    time: "5h ago",
    messages: [
      { sender: "Eoj", role: "you", kind: "human", time: "05:20", text: "Small fix, done directly — no executor needed." },
    ],
    review: null,
  },
];

const listEl = document.getElementById("threadList");
const detailEl = document.getElementById("detail");
let selectedId = THREADS[0].id;

function renderList() {
  listEl.innerHTML = THREADS.map(t => `
    <div class="thread-row ${t.read ? 'read' : ''} ${t.id === selectedId ? 'selected' : ''}" data-id="${t.id}">
      <div class="dot"></div>
      <div class="thread-row-body">
        <div class="thread-topic">${t.topic}</div>
        <div class="thread-preview">${t.messages[t.messages.length - 1].text}</div>
        <div class="thread-meta">
          <span class="thread-time">${t.time}</span>
          ${t.needsReview ? '<span class="pill pill-review">Needs review</span>' : ''}
          ${t.review && t.review.resolved ? '<span class="pill pill-done">Resolved</span>' : ''}
        </div>
      </div>
    </div>
  `).join("");
  listEl.querySelectorAll(".thread-row").forEach(row => {
    row.addEventListener("click", () => {
      selectedId = row.dataset.id;
      const t = THREADS.find(x => x.id === selectedId);
      t.read = true;
      renderList();
      renderDetail();
    });
  });
}

function avatarFor(kind) {
  if (kind === "agent") return '<div class="msg-avatar agent">G</div>';
  if (kind === "human") return '<div class="msg-avatar human">E</div>';
  return '<div class="msg-avatar system">⚙</div>';
}

function renderDetail() {
  const t = THREADS.find(x => x.id === selectedId);
  detailEl.innerHTML = `
    <div class="detail-header">
      <div class="topic">${t.topic}</div>
      <div class="thread-id">${t.id}</div>
      <div class="detail-actions">
        <button class="btn">Archive</button>
        <button class="btn">Share asset</button>
      </div>
    </div>
    <div class="messages">
      ${t.messages.map(m => `
        <div class="msg">
          ${avatarFor(m.kind)}
          <div class="msg-body">
            <div class="msg-sender">${m.sender}<span class="role">${m.role}</span></div>
            <div class="msg-text">${m.text}</div>
            <div class="msg-time">${m.time}</div>
          </div>
        </div>
      `).join("")}
      ${t.review ? `
        <div class="review-card ${t.review.resolved ? 'resolved' : ''}" id="reviewCard">
          <div class="rc-title"><span class="ico">⚠</span> Review requested</div>
          <div class="rc-diff">${t.review.diff}</div>
          <div class="rc-actions">
            <button class="btn btn-approve" id="approveBtn">Approve</button>
            <button class="btn btn-deny" id="denyBtn">Deny</button>
          </div>
          <div class="resolved-tag">✓ Approved and merged</div>
        </div>
      ` : ''}
    </div>
    <div class="composer">
      <div class="composer-box">
        <input type="text" placeholder="Reply in this thread…" />
        <button class="send-btn">Send</button>
      </div>
    </div>
  `;
  const approveBtn = document.getElementById("approveBtn");
  if (approveBtn) {
    approveBtn.addEventListener("click", () => {
      t.review.resolved = true;
      t.messages.push({ sender: "Eoj", role: "you", kind: "human", time: "now", text: "Approved." });
      renderDetail();
      renderList();
    });
  }
  const denyBtn = document.getElementById("denyBtn");
  if (denyBtn) {
    denyBtn.addEventListener("click", () => {
      t.messages.push({ sender: "Eoj", role: "you", kind: "human", time: "now", text: "Denied — needs changes." });
      renderDetail();
    });
  }
}

renderList();
renderDetail();
</script>
