name: Discovery Blog

on:
  schedule:
    # Every Thursday at 09:00 UTC
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm install --prefix .github/scripts --no-audit --no-fund agent-twitter-client

      - name: Import bookmarks
        run: node .github/scripts/import-bookmarks.cjs

      - name: Generate blog post
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
        run: node .github/scripts/generate-blog.cjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add surfaces/ai.allternit.com/src/data/discovery-pipeline.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: weekly blog $(date -u +%Y-W%V)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare-pages.yml --ref main
