name: Publish Gizzi Code to NPM

on:
  push:
    tags:
      - 'gizzi-code/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    # Same quality gate as release-gizzi-code.yml: typecheck + CI smoke suite
    # must pass on the tagged commit before anything is published.
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # Full workspace install: gizzi-code imports packages it doesn't
        # declare (they resolve via the root node_modules, same as local
        # builds). A filtered install misses them and typecheck fails.
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      - name: Build workspace package dependencies
        # Nested workspace packages ship gitignored dist/ output; build them
        # before typechecking. gizzi-sdk is used by imports but never declared
        # in package.json, so it needs an explicit build invocation.
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Configure git identity
        # Test fixtures create temp repos and run `git commit`; runners have
        # no global identity, which fails those tests with exit 128. Local
        # dev machines pass because the developer's git config exists.
        run: |
          git config --global user.email "ci@gizziio.com"
          git config --global user.name "Gizzi CI"

      - name: Typecheck
        working-directory: cmd/gizzi-code
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run typecheck

      - name: CI smoke test
        working-directory: cmd/gizzi-code
        shell: bash
        run: |
          if [ ! -f script/ci-smoke-test.sh ]; then
            echo "::error::cmd/gizzi-code/script/ci-smoke-test.sh is missing."
            echo "::error::Refusing to publish without the CI smoke suite. Restore the script or fix this workflow reference."
            exit 1
          fi
          bash script/ci-smoke-test.sh

  build-platform-packages:
    # Cross-platform binaries. Bun cannot cross-compile native modules
    # reliably, so each platform binary is built ON that platform and shipped
    # as its own npm package (@allternit/gizzi-code-<platform>-<arch>, with
    # os/cpu constraints so npm only installs the matching one). The main
    # package references these via optionalDependencies and its launcher shim
    # resolves them at runtime.
    needs: quality
    name: Platform binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            node_os: darwin
            node_cpu: arm64
          - target: darwin-x64
            os: macos-13
            node_os: darwin
            node_cpu: x64
          - target: linux-x64
            os: ubuntu-latest
            node_os: linux
            node_cpu: x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node_os: linux
            node_cpu: arm64
          - target: win32-x64
            os: windows-latest
            node_os: win32
            node_cpu: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=${GITHUB_REF_NAME#gizzi-code/v}
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      - name: Build workspace package dependencies
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Build ${{ matrix.target }} binary
        working-directory: cmd/gizzi-code
        shell: bash
        run: bun run build --target=${{ matrix.target }}

      - name: Setup Node for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
          NODE_OS: ${{ matrix.node_os }}
          NODE_CPU: ${{ matrix.node_cpu }}
        run: |
          set -euo pipefail
          cd cmd/gizzi-code
          BIN="dist/gizzi-code-${TARGET}"
          [ "$NODE_OS" = "win32" ] && BIN="${BIN}.exe"
          test -f "$BIN"
          export PKG_DIR="${RUNNER_TEMP}/platform-pkg"
          mkdir -p "$PKG_DIR"
          cp "$BIN" "$PKG_DIR/"
          export BIN_BASENAME=$(basename "$BIN")
          node -e '
            const fs = require("fs");
            const pkg = {
              name: `@allternit/gizzi-code-${process.env.TARGET}`,
              version: process.env.VERSION,
              description: `gizzi-code prebuilt binary for ${process.env.TARGET}`,
              license: "MIT",
              os: [process.env.NODE_OS],
              cpu: [process.env.NODE_CPU],
              files: [process.env.BIN_BASENAME],
              repository: {
                type: "git",
                url: "https://github.com/Gizziio/allternit-platform.git",
                directory: "cmd/gizzi-code",
              },
            };
            fs.writeFileSync(`${process.env.PKG_DIR}/package.json`, JSON.stringify(pkg, null, 2) + "\n");
          '
          cd "$PKG_DIR"
          npm publish --access public

  publish:
    needs: [quality, build-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Must match package.json packageManager and the quality gate:
          # 1.2.x cannot resolve the `bun:bundle` builtin used in src/.
          bun-version: 1.3.14

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF_NAME#gizzi-code/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        # Root-level pnpm install (same as the quality gate): bun install in
        # cmd/gizzi-code cannot resolve workspace:* deps — bun's workspace
        # discovery does not match this repo's pnpm workspace layout.
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      - name: Build workspace package dependencies
        # Nested workspace packages ship gitignored dist/ output; the build
        # and typecheck below need them (gizzi-sdk is imported but undeclared).
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Configure git identity
        # Same fixture requirement as the quality gate: temp-repo commits
        # need a git identity on the runner.
        run: |
          git config --global user.email "ci@gizziio.com"
          git config --global user.name "Gizzi CI"

      - name: Run test suite
        # Blocking gate: do not publish a version whose tests fail.
        working-directory: cmd/gizzi-code
        run: bun run test

      - name: Build
        working-directory: cmd/gizzi-code
        run: bun run build

      - name: Setup Node for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update version in package.json
        # npm errors "Version not changed" when the version already matches
        # (package.json is committed at release version) — skip in that case.
        working-directory: cmd/gizzi-code
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.VERSION }}" ]; then
            npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          else
            echo "package.json already at $CURRENT; skipping bump"
          fi

      - name: Pin optionalDependencies to release version
        # Platform binary packages publish at exactly this version; pin the
        # optionalDependencies so they resolve to the same release.
        working-directory: cmd/gizzi-code
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const name of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[name] = process.env.VERSION;
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Publish to NPM
        working-directory: cmd/gizzi-code
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        # Download the tarball we JUST published from the registry and fail
        # the release if it cannot install a working CLI: bin entries must
        # resolve, and the binary must come from either a bundled dist/ or
        # the optional platform packages (cross-platform distribution).
        shell: bash
        run: |
          set -euo pipefail
          PKG="@allternit/gizzi-code"
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARBALL=""
          # The registry can lag behind the publish; retry briefly.
          for attempt in 1 2 3 4 5; do
            TARBALL=$(npm view "$PKG@$VERSION" dist.tarball 2>/dev/null || true)
            [ -n "$TARBALL" ] && break
            echo "Tarball for $PKG@$VERSION not visible yet (attempt $attempt); sleeping 10s"
            sleep 10
          done
          if [ -z "$TARBALL" ]; then
            echo "::error::Could not resolve dist.tarball for $PKG@$VERSION from the registry."
            exit 1
          fi
          echo "Verifying $TARBALL"
          TMP=$(mktemp -d)
          curl -fsSL "$TARBALL" -o "$TMP/package.tgz"
          # List once: piping tar into `grep -q` can SIGPIPE-kill tar, and with
          # pipefail that would false-negative the gate.
          FILES=$(tar -tzf "$TMP/package.tgz")
          if ! grep -q '/dist/' <<< "$FILES"; then
            echo "::error::Published $PKG@$VERSION tarball contains no dist/ — the package is broken (dangling bin symlinks). Yank it and fix the publish."
            exit 1
          fi
          # bin entries must resolve to real files inside the tarball — a bin
          # pointing at a missing path installs a dangling shim.
          BIN_PATHS=$(tar -xzf "$TMP/package.tgz" -O package/package.json \
            | python3 -c 'import json,sys; b=json.load(sys.stdin).get("bin",{}); print("\n".join(b.values() if isinstance(b,dict) else [b]))')
          if [ -z "$BIN_PATHS" ]; then
            echo "::error::Published $PKG@$VERSION has no bin entries in package.json — nothing to execute after install."
            exit 1
          fi
          while IFS= read -r p; do
            p="${p#./}"
            if ! grep -qF "package/$p" <<< "$FILES"; then
              echo "::error::Published $PKG@$VERSION bin entry '$p' is missing from the tarball — bin symlinks would dangle. Yank it and fix the publish."
              exit 1
            fi
          done <<< "$BIN_PATHS"
          # Optional platform packages must exist at the pinned version.
          OPTS=$(tar -xzf "$TMP/package.tgz" -O package/package.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin).get("optionalDependencies",{}); print("\n".join(f"{k} {v}" for k,v in d.items()))')
          if [ -z "$OPTS" ]; then
            echo "::error::Published $PKG@$VERSION has no optionalDependencies — cross-platform installs would have no binaries."
            exit 1
          fi
          while IFS= read -r name_ver; do
            name="${name_ver% *}"
            if ! npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::error::Platform package $name@$VERSION is missing from the registry."
              exit 1
            fi
          done <<< "$OPTS"
          echo "Verified: published $PKG@$VERSION contains dist/, all bin entries resolve, and all platform packages exist."
