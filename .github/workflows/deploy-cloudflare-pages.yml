name: Deploy Platform to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/ai.allternit.com/**'
      - 'packages/@allternit/**'
      - 'services/runtime/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache disabled temporarily to clear a stale pnpm-store snapshot that
          # resolved incompatible @blocksuite/icons transitive versions. Re-enable
          # once this run produces a good store snapshot.

      # Install from monorepo root so all workspace:* packages resolve correctly.
      # Use --frozen-lockfile so CI matches the committed pnpm-lock.yaml and local
      # builds; --no-frozen-lockfile was resolving newer transitive versions that
      # broke production builds (e.g. @blocksuite/icons re-exports).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        working-directory: surfaces/ai.allternit.com
        run: pnpm prisma generate

      - name: Copy discovery feed to public
        # Makes discovery-pipeline.json available as a static file at /discovery-feed.json
        # so the desktop app can fetch fresh briefings from platform.allternit.com without
        # a full app rebuild. The _headers file already adds CORS for this path.
        run: |
          if [ -f surfaces/ai.allternit.com/src/data/discovery-pipeline.json ]; then
            cp surfaces/ai.allternit.com/src/data/discovery-pipeline.json surfaces/ai.allternit.com/public/discovery-feed.json
            echo "Copied discovery-pipeline.json to public/discovery-feed.json"
          else
            echo "No discovery-pipeline.json found, skipping"
          fi

      - name: Build static export
        # Build the full dependency graph (office-* engines, apps, etc.) so that
        # packages whose `dist/` directories are not committed are available —
        # same pattern as deploy-office-cloudflare.yml.
        # Vite SPA build — outputs dist/, which the deploy step below publishes.
        # NEXT_PUBLIC_ALLTERNIT_DESKTOP_AUTH enables the desktop session shim so
        # the startup wizard sign-in is the only login inside the desktop shell.
        run: pnpm --filter "@allternit/ai..." build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALLTERNIT_DESKTOP_AUTH: 'true'
          NEXT_PUBLIC_ALLTERNIT_CLOUD_API_URL: 'https://api.allternit.com'
          NEXT_PUBLIC_ALLTERNIT_PUSH_WORKER_URL: ${{ secrets.NEXT_PUBLIC_ALLTERNIT_PUSH_WORKER_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy surfaces/ai.allternit.com/dist --project-name=allternit-platform --branch=main
