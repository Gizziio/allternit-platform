name: Deploy AI + Platform to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/ai.allternit.com/**'
      - 'surfaces/platform.allternit.com/**'
      - 'packages/@allternit/**'
      - 'services/runtime/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  deploy-ai:
    name: Deploy ai.allternit.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        working-directory: surfaces/ai.allternit.com
        run: pnpm prisma generate

      - name: Copy discovery feed to public
        run: |
          if [ -f surfaces/ai.allternit.com/src/data/discovery-pipeline.json ]; then
            cp surfaces/ai.allternit.com/src/data/discovery-pipeline.json surfaces/ai.allternit.com/public/discovery-feed.json
            echo "Copied discovery-pipeline.json to public/discovery-feed.json"
          else
            echo "No discovery-pipeline.json found, skipping"
          fi

      - name: Build ai.allternit.com static export
        run: pnpm --filter "@allternit/ai..." build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALLTERNIT_DESKTOP_AUTH: 'true'
          NEXT_PUBLIC_ALLTERNIT_CLOUD_API_URL: 'https://api.allternit.com'
          VITE_REMOTE_CONTROL_PUSH_URL: ${{ secrets.VITE_REMOTE_CONTROL_PUSH_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Deploy ai.allternit.com to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy surfaces/ai.allternit.com/dist --project-name=ai-allternit --branch=main

  deploy-platform:
    name: Deploy platform.allternit.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build platform.allternit.com
        run: pnpm --filter "@allternit/platform-console" build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          VITE_ALLTERNIT_GATEWAY_URL: 'https://api.allternit.com'
          VITE_ALLTERNIT_CLOUD_API_URL: 'https://api.allternit.com'

      - name: Deploy platform.allternit.com to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy surfaces/platform.allternit.com/dist --project-name=allternit-platform --branch=main
