name: Secrets scan (gitleaks)

# Scans pull requests and new pushes for committed secrets.
# NOTE: this scans the diff (new/changed commits only). Git history before
# 2026-09-03 contains revoked secrets (see reports/2026-09-03-production-
# readiness-gap-analysis.md §Step 4) — history rewriting (BFG/git-filter-repo)
# and credential rotation are tracked there; this gate exists so no NEW
# secret lands.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
