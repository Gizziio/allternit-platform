name: Deploy Remote Control to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/ai.allternit.com/**'
      - 'services/remote-control-push/**'
      - '.github/workflows/deploy-remote-control-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        working-directory: surfaces/ai.allternit.com
        run: pnpm prisma generate

      - name: Build remote control dashboard
        working-directory: surfaces/ai.allternit.com
        run: pnpm exec vite build --config vite.remote-control.config.ts
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALLTERNIT_DESKTOP_AUTH: 'true'
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VITE_ALLTERNIT_API_URL: 'https://api.allternit.com'
          VITE_ALLTERNIT_PLATFORM_URL: 'https://platform.allternit.com'
          VITE_REMOTE_CONTROL_PUSH_URL: 'https://push.remotecontrol.allternit.com'

      - name: Prepare remote control Pages artifact
        run: |
          mkdir -p tmp/remote-control
          cp -R surfaces/ai.allternit.com/dist/* tmp/remote-control/
          mv tmp/remote-control/remote-control.html tmp/remote-control/index.html
          echo "Prepared remotecontrol.allternit.com artifact"

      - name: Deploy remote control dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tmp/remote-control --project-name=allternit-remote-control --branch=main

  deploy-push-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy push worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/remote-control-push
          command: deploy
