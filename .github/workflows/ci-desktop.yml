name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/allternit-desktop/**'
      - 'cmd/allternit-api/**'
      - 'surfaces/ai.allternit.com/**'
      - '.github/workflows/ci-desktop.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'surfaces/allternit-desktop/**'
      - 'cmd/allternit-api/**'
      - 'surfaces/ai.allternit.com/**'
      - '.github/workflows/ci-desktop.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Desktop unit tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop unit tests
        # vitest.config.ts scopes this to src/main/**/*.test.ts —
        # Playwright e2e specs in tests/ are NOT run here.
        run: pnpm --filter @allternit/desktop test

  typecheck-and-build:
    name: Typecheck and build desktop
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop main + preload
        run: pnpm --filter @allternit/desktop typecheck

      - name: Build desktop TypeScript
        run: pnpm --filter @allternit/desktop build
