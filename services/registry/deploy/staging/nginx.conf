# TLS termination and rate limiting for the registry API (staging).
# Place a certificate + key in ./certs (registry.crt / registry.key).

events {}

http {
  # Generous defaults for large release-archive uploads.
  client_max_body_size 550m;

  # Rate limits: strict for admin/intake mutations, moderate for reads.
  limit_req_zone $binary_remote_addr zone=registry_write:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=registry_read:10m rate=60r/s;

  upstream registry {
    server registry:3109;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/registry.crt;
    ssl_certificate_key /etc/nginx/certs/registry.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audit log: one line per request with status and latency. Never log
    # Authorization headers (nginx does not log headers by default).
    access_log /var/log/nginx/registry-access.json combined;
    error_log  /var/log/nginx/registry-error.log warn;

    location /v1/ {
      limit_req zone=registry_read burst=30 nodelay;
      proxy_pass http://registry;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    location ~ ^/v1/(miniapps/submissions|miniapps/.*/review|miniapps/.*/uploads|miniapps/.*/uploads/complete|miniapps/.*/install-events|miniapps/.*/ratings|publishers/keys|admin/|intake/) {
      limit_req zone=registry_write burst=10 nodelay;
      proxy_pass http://registry;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    location /health {
      proxy_pass http://registry/v1/miniapps?limit=1;
      proxy_set_header Host $host;
      access_log off;
    }
  }
}
