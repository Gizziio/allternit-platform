name = "allternit-remote-control-push"
main = "src/index.ts"
compatibility_date = "2024-08-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain for the push worker.
[[routes]]
pattern = "push.remotecontrol.allternit.com"
custom_domain = true

# Remove the Durable Object class introduced by the previous edge-relay
# incarnation so this push-only worker can replace it.
[[migrations]]
tag = "v2"
deleted_classes = ["RuntimeRelay"]

# KV namespace for push subscriptions and pending notification payloads.
[[kv_namespaces]]
binding = "REMOTE_CONTROL_PUSH_KV"
id = "81d4bf1cc2c14cc1a0ba7bec8aad9392"

[vars]
# Set VAPID_JWK, VAPID_PUBLIC_KEY, NOTIFY_SECRET, and CLERK_JWKS_URL via
# `wrangler secret put` for production.
# Example:
#   wrangler secret put VAPID_JWK
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put NOTIFY_SECRET
#   wrangler secret put CLERK_JWKS_URL
# Generate keys with:
#   npx web-push generate-vapid-keys
# Then format the private key as a JWK (d, x, y, crv=P-256, kty=EC).
