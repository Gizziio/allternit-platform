[package]
name = "allternit-cloud-ssh"
version = "0.1.0"
edition = "2021"
description = "Allternit Cloud SSH Executor - Real SSH connection management"

[dependencies]
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# SSH library (synchronous, wrapped in spawn_blocking for async)
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[dev-dependencies]
tokio-test = "0.4"
