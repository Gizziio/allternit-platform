# http-context config for the interim 8013 proxy (ADR D4 hardening).
# Live on mail at /etc/nginx/conf.d/allternit-cors-map.conf (deployed 2026-09-03).
#
# 8013 (allternit-api) mirrors ANY CORS origin in its own responses, so the
# location blocks in nginx-api-allternit-interim-proxy.conf use
# `proxy_hide_header Access-Control-Allow-Origin/-Credentials` and emit ONLY
# this allowlist. Empty map value = header omitted = browser blocks. Fail closed.

map $http_origin $allternit_cors_origin {
    default "";
    "https://ai.allternit.com"       $http_origin;
    "https://platform.allternit.com" $http_origin;
}

# Audit-conf TODO: rate limiting for the 8013-owned prefixes.
limit_req_zone $binary_remote_addr zone=allternit_api_jobs:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=allternit_api_beta:10m rate=60r/m;
