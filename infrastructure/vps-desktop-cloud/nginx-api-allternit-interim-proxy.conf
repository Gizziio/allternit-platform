# Interim proxy: route allternit-api (8013) prefixes through api.allternit.com
#
# Decided 2026-09-03 (docs/Architecture/2026-09-03-control-plane-data-plane-decision.md, D4).
# This is a STOPGAP until the route migration into cloud-api lands (P1 of the decision doc).
# When a namespace is migrated, delete its location block here. Delete this file when empty.
#
# Deployment (owner-gated, on `mail` / api.allternit.com):
#   1. Merge these location blocks into the EXISTING api.allternit.com server block
#      (the one that proxies to cloud-api on 127.0.0.1:8082). Place them ABOVE the
#      default location. Do NOT create a new server block.
#   2. nginx -t && systemctl reload nginx
#
# Safety: verified against cmd/allternit-cloud-api/src/lib.rs — cloud-api defines NO
# routes under these prefixes (its jobs live at /api/v1/runs/:run_id/jobs), so these
# blocks cannot shadow cloud-api routes. Recheck before adding any new prefix.

# --- allternit-api (8013) owned prefixes -------------------------------------

location /api/jobs {
    proxy_pass http://127.0.0.1:8013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location /api/v1/agent-sessions {
    proxy_pass http://127.0.0.1:8013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE support for session event streams
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location /api/v1/office/ {
    proxy_pass http://127.0.0.1:8013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/beta/ {
    proxy_pass http://127.0.0.1:8013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location /api/rails/ {
    proxy_pass http://127.0.0.1:8013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

