# RESOLVED 2026-09-03 (decision doc A4): the previously unverified client paths
#   /api/chat, /api/v1/sessions/*/events, /api/v1/agents/*/events,
#   /api/v1/operator/events/*
# exist on NEITHER backend — they are orphaned api-client.ts calls. Do NOT add
# them here; fix the client (repoint chat to the cloud-api model router, sessions
# to /api/v1/agent-sessions on 8013, or delete).
#
# AUTH REALITY (A1): production 401s every path today — cloud-api's auth layer
# runs before routing. After this proxy deploys, the five prefixes above will
# reach 8013 but still answer 401 until the P1 control-plane handlers + data-plane
# JWT land. Until then, feature-flag the calling widgets (P0 item 4). Expect
# "routed to 8013" to look like a 401 with a DIFFERENT body/headers than
# cloud-api's 401 — compare `www-authenticate` / server headers to confirm.
#
# Hardening required since 8013 was never public:
#   - allternit-api currently mirrors any CORS origin (audit grade C). Add an
#     allowlist (https://platform.allternit.com, https://ai.allternit.com) at
#     nginx or fix in the binary before/just after this proxy goes live.
#   - add limit_req zones for the /api/jobs and /api/v1/beta/ prefixes.
#
# DEPLOYED 2026-09-03 on mail: both items done at nginx. The deployed server
# block adds, per 8013 location: CORS allowlist via the
# $allternit_cors_origin map (see nginx-allternit-cors-map.conf, live at
# /etc/nginx/conf.d/allternit-cors-map.conf), an OPTIONS preflight branch
# (204 + allow headers), `proxy_hide_header Access-Control-Allow-Origin`
# and `-Credentials` so 8013's mirror-any-origin is stripped (verified:
# disallowed origins receive NO ACAO on GET), and limit_req
# (allternit_api_jobs 30r/m on /api/jobs, allternit_api_beta 60r/m on
# /api/v1/beta/). Pre-deploy backup: /root/api-allternit.bak-20260903.
# Verified live: /api/jobs → 501 with 8013 body (routed), /api/v1/runs still
# cloud-api-shaped, preflight 204 for allowed origins only.
# Remaining binary-side hardening (still worth doing): fix CORS mirror in
# allternit-api source so direct-to-8013 exposure is also safe (P2).

