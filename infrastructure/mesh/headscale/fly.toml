app = 'allternit-headscale'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'headscale_data'
  destination = '/var/lib/headscale'

[http_service]
  internal_port = 8080
  force_https = true
  # A coordination server must stay up: never auto-stop, always keep one machine.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '60s'
  method = 'GET'
  path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
