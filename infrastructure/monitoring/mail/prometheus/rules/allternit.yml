groups:
  - name: allternit-cloud-api
    rules:
      - alert: AllternitApiDown
        expr: up{job="allternit-cloud-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Allternit Cloud API is down"
          description: "The Allternit Cloud API has been unreachable for more than 1 minute."

      - alert: AllternitApiHighErrorRate
        expr: rate(allternit_api_request_errors_total[5m]) / rate(allternit_api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Allternit Cloud API"
          description: "Error rate is above 5% for the last 5 minutes."

      - alert: AllternitApiHighLatency
        expr: rate(allternit_api_request_duration_microseconds_total[5m]) / rate(allternit_api_requests_total[5m]) > 500000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on Allternit Cloud API"
          description: "Average request latency is above 500ms for the last 5 minutes."
