app = 'allternit-cloud-api'
primary_region = 'lax'

[build]
  dockerfile = 'cmd/allternit-cloud-api/Dockerfile'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  BIND_ADDR = '0.0.0.0:8080'
  DATABASE_URL = 'sqlite:///data/api.db'
  RUST_LOG = 'info'
  ALLTERNIT_PLATFORM_URL = 'https://platform.allternit.com'
  CORS_ALLOWED_ORIGINS = 'https://platform.allternit.com,https://ai.allternit.com'
  DEFAULT_PLAN_TIER = 'free'
  RATE_LIMIT_RPM = '60'
  PUBLIC_RATE_LIMIT_RPM = '30'

[[mounts]]
  source = 'allternit_cloud_api_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '60s'
  method = 'GET'
  path = '/api/v1/health/live'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
