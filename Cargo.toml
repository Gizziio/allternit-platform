[workspace]
resolver = "2"

members = [
    "services/orchestration/orchestration/platform-orchestration-service",
    "cmd/allternit-api",
    "cmd/allternit-cloud-api",
    "cmd/allternit-cloud-wizard",
    # "cmd/launcher",  # DISABLED: requires missing embed pipeline (api/embed/allternit-api, shell-ui/dist). See cmd/launcher/README.md
    "rails",
    "rails/cli",
    "domains/kernel/core/kernel-contracts",
    "domains/kernel/core/wasm-runtime",
    "platform/contracts/driver-interface",
    "domains/kernel/drivers/allternit-openclaw-host",
    "domains/kernel/drivers/system-law",
    "drivers/apple-vf",
    "drivers/firecracker",
    "services/session-manager",
    "services/vm-executor",
    "mcp/core",
    "mcp/mcp-client",
    "infrastructure/cloud",
    "infrastructure/cloud/allternit-cloud-deploy",
    "infrastructure/cloud/allternit-cloud-ssh",
    "infrastructure/executor",
    "infrastructure/executor/cowork/cowork/allternit-cowork-runtime",
    "infrastructure/executor/cowork/cowork/allternit-cowork-scheduler",
    "infrastructure/providers/hetzner",
    "services/orchestration/control-plane/allternit-agent-orchestration/workflows",
    "services/orchestration/orchestration/policy-service",
    "services/voice",
    "api/services/workspace-service",
    "services/orchestration/control-plane/unified-registry/registry",
    "domains/agent/allternit-agent-workspace/allternit-agent-workspace",
    "services/memory",
    "services/memory/data/memory-fabric",
    # Referenced by workspace.dependencies but previously outside the workspace
    "platform/contracts/capsule/capsule-system/allternit-capsule",
    "platform/contracts/capsule/capsule-system/allternit-capsule-sdk",
    "platform/protocols/canvas-protocol",
    "services/memory/data/history-ledger",
    "domains/governance/identity-access-control/policy-engine",
    "domains/governance/identity-access-control/policy-tier-gating",
    "platform/protocols/communication/kernel-messaging",
    "domains/governance/governance-workflows/core-governance",
    "domains/governance/security-network/security-hardening",
    "domains/governance/identity-access-control/purpose-binding",
    "domains/kernel/drivers/ontology-runtime",
    "platform/sdk/adapters/rust/skills",
    "platform/sdk/rust/sdk-core",
    "platform/sdk/rust/sdk-apps",
    "platform/sdk/rust/sdk-functions",
    "platform/sdk/rust/sdk-policy",
    "platform/sdk/rust/sdk-transport",
    "api/gateway/routing",
    "platform/types/allternit-substrate",
    "domains/kernel/core/runtime-execution-core",
    "services/orchestration/control-plane/allternit-control/context-router",
    "domains/kernel/drivers/evolution-layer",
    "services/memory/data/memory-kernel",
    "services/memory/observation",
    "services/memory/state/history",
    "services/memory/state/memory",
    "domains/governance/audit-logging/core-audit",
    "domains/governance/identity-access-control/core-policy",
    "domains/kernel/allternit-intent-graph-kernel/allternit-intent-graph-kernel",
    "domains/kernel/allternit-presentation-kernel",
    "domains/kernel/drivers/ivkge-advanced",
    "domains/kernel/drivers/multimodal-streaming",
    "domains/kernel/drivers/swarm-advanced",
    "domains/kernel/drivers/tambo-integration",
    "domains/kernel/drivers/tambo-napi",
    "domains/kernel/service/allternit-local-compute/local-inference-gguf",
    "domains/kernel/service/environment-standardization",
    "domains/kernel/service/multimodal-streaming",
    "infrastructure/local",
    "platform/protocols/allternit-protocol",
    "services/gateway/stdio",
    "services/registry/apps-registry",
    "services/registry/framework-registry",
    "services/registry/functions-registry",
    "worktree-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/allternitchitect/allternit"
authors = ["Allternit Team <team@allternitchitect.com>"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ALL_TESTS_DISABLED)'] }

[workspace.dependencies]
# Internal Crate Dependencies
allternit-driver-interface = { path = "platform/contracts/driver-interface" }
allternit-apple-vf-driver = { path = "drivers/apple-vf" }
allternit-firecracker-driver = { path = "drivers/firecracker" }
allternit-session-manager = { path = "services/session-manager" }
allternit-vm-executor = { path = "services/vm-executor" }
allternit-agent-system-rails = { path = "rails" }
allternit-cowork-runtime = { path = "infrastructure/executor/cowork/cowork/allternit-cowork-runtime" }
allternit-cowork-scheduler = { path = "infrastructure/executor/cowork/cowork/allternit-cowork-scheduler" }
allternit-workspace-service = { path = "api/services/workspace-service" }
allternit-capsule = { path = "platform/contracts/capsule/capsule-system/allternit-capsule" }
allternit-capsule-sdk = { path = "platform/contracts/capsule/capsule-system/allternit-capsule-sdk" }
allternit-canvas-protocol = { path = "platform/protocols/canvas-protocol" }
allternit-history = { path = "services/memory/data/history-ledger" }
allternit-memory-fabric = { path = "services/memory/data/memory-fabric" }
allternit-policy = { path = "domains/governance/identity-access-control/policy-engine" }
allternit-policy-tier-gating = { path = "domains/governance/identity-access-control/policy-tier-gating" }
allternit-messaging = { path = "platform/protocols/communication/kernel-messaging" }
allternit-security-governance = { path = "domains/governance/governance-workflows/core-governance" }
allternit-security-hardening = { path = "domains/governance/security-network/security-hardening" }
allternit-purpose-binding = { path = "domains/governance/identity-access-control/purpose-binding" }
allternit-ontology-runtime = { path = "domains/kernel/drivers/ontology-runtime" }
allternit-system-law = { path = "domains/kernel/drivers/system-law" }
allternit-kernel-contracts = { path = "domains/kernel/core/kernel-contracts" }
allternit-skills = { path = "platform/sdk/adapters/rust/skills" }
allternit-sdk-core = { path = "platform/sdk/rust/sdk-core" }
allternit-sdk-apps = { path = "platform/sdk/rust/sdk-apps" }
allternit-sdk-functions = { path = "platform/sdk/rust/sdk-functions" }
allternit-sdk-policy = { path = "platform/sdk/rust/sdk-policy" }
allternit-sdk-transport = { path = "platform/sdk/rust/sdk-transport" }

allternit-substrate = { path = "platform/types/allternit-substrate" }
allternit-runtime-core = { path = "domains/kernel/core/runtime-execution-core" }
allternit-context-router = { path = "services/orchestration/control-plane/allternit-control/context-router" }
allternit-evolution-layer = { path = "domains/kernel/drivers/evolution-layer" }
allternit-memory-kernel = { path = "services/memory/data/memory-kernel" }
allternit-observation = { path = "services/memory/observation" }
history = { path = "services/memory/state/history" }
allternit-memory = { path = "services/memory/state/memory" }

audit-log = { path = "domains/governance/audit-logging/core-audit" }
policy = { path = "domains/governance/identity-access-control/core-policy" }
intent-graph-kernel = { path = "domains/kernel/allternit-intent-graph-kernel/allternit-intent-graph-kernel" }
presentation-kernel = { path = "domains/kernel/allternit-presentation-kernel" }
allternit-ivkge-advanced = { path = "domains/kernel/drivers/ivkge-advanced" }
allternit-multimodal-streaming = { path = "domains/kernel/drivers/multimodal-streaming" }
allternit-swarm-advanced = { path = "domains/kernel/drivers/swarm-advanced" }
allternit-tambo-integration = { path = "domains/kernel/drivers/tambo-integration" }
allternit-tambo-napi = { path = "domains/kernel/drivers/tambo-napi" }
local-inference = { path = "domains/kernel/service/allternit-local-compute/local-inference-gguf" }
allternit-environment = { path = "domains/kernel/service/environment-standardization" }
multimodal-streaming-execution = { path = "domains/kernel/service/multimodal-streaming" }
allternit-multi-region = { path = "infrastructure/local" }
allternit-protocol = { path = "platform/protocols/allternit-protocol" }
gateway-stdio = { path = "services/gateway/stdio" }

allternit-registry-apps = { path = "services/registry/apps-registry" }
framework = { path = "services/registry/framework-registry" }
allternit-registry-functions = { path = "services/registry/functions-registry" }


allternit-tools-gateway = { path = "api/gateway/routing" }
allternit-harness-engineering = { path = "domains/kernel/drivers/harness-engineering" }
mcp = { path = "mcp/core" }
mcp-client = { path = "mcp/mcp-client" }
allternit-workflows = { path = "services/orchestration/control-plane/allternit-agent-orchestration/workflows" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tempfile = "3.8"
once_cell = "1.19"

# HTTP/Web
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs"] }
axum = { version = "0.7", features = ["ws", "http1", "http2"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
urlencoding = "2.1"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.21"
http = "1.0"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["full"] }

# Docker
bollard = "0.15"

# Crypto/Security
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
blake3 = "1.5"
ed25519-dalek = { version = "2.0", features = ["std", "rand_core"] }
ring = "0.17"
data-encoding = "2.0"
hex = "0.4"

# Async/Futures
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
redis = { version = "0.24", features = ["aio", "tokio-comp"] }

lru = "0.12"
qdrant-client = "1.9"

# WASM
wasmtime = "21.0"
wasmtime-wasi = "21.0"
wit-bindgen = "0.36"
wit-component = "0.21"

# Utils
semver = "1.0"
rand = "0.8"
regex = "1.0"
clap = { version = "4.0", features = ["derive"] }
portable-pty = "0.8"
which = "6.0"
walkdir = "2.5"
dirs = "5.0"
bytes = "1.5"
lazy_static = "1.4"
serde_yaml = "0.9"
toml = "0.8"
tar = "0.4"
flate2 = "1.0"
indicatif = "0.17"
zstd = "0.13"

# Terminal
crossterm = "0.27"
ratatui = "0.26"

# Testing
tokio-test = "0.4"

# Scheduling
tokio-cron-scheduler = "0.10"

# OpenTelemetry
opentelemetry = { version = "0.20", features = ["trace"] }
opentelemetry_sdk = { version = "0.20", features = ["trace", "rt-tokio"] }
opentelemetry-http = "0.9"
tracing-opentelemetry = "0.23"

# API Documentation
utoipa = { version = "4.2", features = ["uuid", "chrono"] }

# Metrics
prometheus = "0.13"

# Validation
validator = { version = "0.18", features = ["derive"] }
serde_bytes = "0.11"

# Extism
extism = "1.0"
extism-convert = "1.0"
extism-convert-macros = "1.0"

# ACP
agent-client-protocol-schema = "0.10.8"
extism-manifest = "1.0"

# gRPC / Protocol Buffers
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
